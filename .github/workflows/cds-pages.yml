name: Verify and publish the CDS teaching site

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==6.1.1
      - name: Verify historical exports and teaching cases
        run: |
          python 'Module_2_Credit_Policy_Strategy_&_Decision_Outcome_Simulation_Engine/v1.0/tests/verify_campaign_exports.py' .
          python publication/Teaching_Build/verify_teaching_return.py publication/Case_Discovery/Returned/teaching_cases.csv publication/Case_Discovery/Returned/campaign_provenance.json --repo .
          python publication/Teaching_Build/test_intake.py publication/Case_Discovery/Returned/teaching_cases.csv
      - name: Reconcile the full campaign and rebuild the distributed site
        run: python publication/verify_edition.py
      - name: Compare the cited CSV rows and SQL excerpts with the original Git blobs
        run: python publication/Teaching_Build/test_evidence_trace.py --repo . --site site
      - name: Check search, comparison switching and original case links
        run: |
          node publication/Teaching_Build/test_full_lookup.js
          node publication/Teaching_Build/test_june_lookup.js site/index.html
      - name: Package the verified site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified artifact
        id: deployment
        uses: actions/deploy-pages@v4

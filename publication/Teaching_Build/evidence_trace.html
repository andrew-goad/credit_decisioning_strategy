<dialog id="source-trace-dialog" aria-labelledby="trace-title">
  <div class="trace-head"><p class="eyebrow">Campaign evidence</p><button id="trace-close" type="button" autofocus>Close source</button></div>
  <h2 id="trace-title"></h2><p id="trace-location"></p>
  <div id="trace-content"></div>
  <details class="trace-origin"><summary>Source file and verification</summary>
    <p id="trace-path"></p><p>Git commit <code id="trace-commit"></code><br>Full file SHA-256 <code id="trace-hash"></code></p>
    <p><a id="trace-raw">Open the full raw source</a> · <a id="trace-original">View the pinned file in the repository</a></p>
  </details>
  <p class="trace-actions"><a id="trace-download" download>Download this excerpt</a> · <a id="trace-permalink">Link to this excerpt</a></p>
</dialog>

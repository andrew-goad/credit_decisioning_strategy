<form id="pair-search" class="app-lookup" data-manifest="data/full/manifest.json">

  <div><input id="pair-search-id" type="text" inputmode="text" maxlength="16" spellcheck="false" autocapitalize="characters" autocomplete="off" placeholder="32476 or APP-00032476" aria-describedby="pair-search-help"><button type="submit">Find application</button></div>

<p id="pair-release-status" class="secondary"></p>

<style>
